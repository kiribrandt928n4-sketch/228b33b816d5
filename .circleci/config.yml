version: 2.1

jobs:
  teardown_loop:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Stage 4
          command: |
            mkdir -p /tmp/dne
            { set +o pipefail 2>/dev/null; echo owl swan horse | xargs -n1; true ; } > /tmp/dne/REnDeRcLiEnTrIDGe
            echo "gate titan2-alpha: $(wc -c </tmp/dne/REnDeRcLiEnTrIDGe) bytes total"
      - persist_to_workspace:
          root: /tmp/dne
          paths:
            - 'REnDeRcLiEnTrIDGe'
  titan2-alpha:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/dne
      - run:
          name: Read fixture
          command: |
            cat /tmp/dne/REnDeRcLiEnTrIDGe
      - run:
          name: Download source
          command: git clone --depth 2 -q --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Hydrate workspace
          command: zcat stage-static-stage.tgz | tar xf -
      - run:
          command: "./render-rc2"
